name: E2E Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # manual trigger from GitHub Actions UI

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Playwright smoke (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # ── Public smoke (no auth needed) ─────────────────────────────────
      # Runs against production. Quick gate for regressions.
      - name: Run public smoke tests
        run: npx playwright test playwright/ --reporter=list
        env:
          PLAYWRIGHT_BASE_URL: https://app.shortstack.work

      # ── Full journey tests (auth needed) ──────────────────────────────
      # Requires E2E_TEST_EMAIL + E2E_TEST_PASSWORD secrets.
      # Skipped automatically if the secrets aren't set (hasTestCreds() guard).
      - name: Run journey tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx playwright test e2e/journeys/ --reporter=list --workers=2 --retries=2
        env:
          PLAYWRIGHT_BASE_URL: https://app.shortstack.work
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14
