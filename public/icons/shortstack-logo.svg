<?xml version="1.0" encoding="UTF-8"?>
<!--
  ShortStack mark — 3-tier stack glyph (Apr 28 refresh).

  Replaces the prior ornate gold mandala (archived at
  shortstack-mandala-archive.svg). Three throw-pillow shapes stacked
  vertically: each tier has rounded sides, a gentle convex bulge on
  the top edge, and a matching convex bulge on the bottom edge. The
  natural "wave" gap between adjacent tiers reads as the brand mark.

  fill="currentColor" so light/dark surfaces just inherit the right
  color from the parent CSS `color` property — pair with text-text-primary
  on a dark sidebar, text-text-secondary on a light page hero, etc.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ShortStack">
  <title>ShortStack</title>
  <g fill="currentColor">
    <!-- Top tier — center y = 72 -->
    <path d="M 56 72
             Q 56 50 84 50
             Q 128 42 172 50
             Q 200 50 200 72
             Q 200 94 172 94
             Q 128 102 84 94
             Q 56 94 56 72 Z"/>
    <!-- Middle tier — center y = 128 -->
    <path d="M 56 128
             Q 56 106 84 106
             Q 128 98 172 106
             Q 200 106 200 128
             Q 200 150 172 150
             Q 128 158 84 150
             Q 56 150 56 128 Z"/>
    <!-- Bottom tier — center y = 184 -->
    <path d="M 56 184
             Q 56 162 84 162
             Q 128 154 172 162
             Q 200 162 200 184
             Q 200 206 172 206
             Q 128 214 84 206
             Q 56 206 56 184 Z"/>
  </g>
</svg>
